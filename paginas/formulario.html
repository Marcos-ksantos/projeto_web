<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO WEB HTML/CSS</title>
</head>

<body>

    <div id="div-form">
        <h3>Formulário</h3>

        <form name="form" id="form" method="post">
            <label for="nome">NOME</label>
            <input type="text" name="nome" id="nome" class="input-vlt01" maxlength=50 required
                placeholder="Informe seu nome">

            <label for="cpf">CPF</label>
            <input type="number" name="cpf" id="cpf" class="input-vlt02" maxlength=14 required
                placeholder="Informe o numero">

            <label for="datanascimento">DATA NASCIMNETO </label>
            <input type="date" name="datanascimento" id="datanascimento" class="input-vlt02" required>

            <label for="sexo">Sexo:</label>
            <input type="radio" name="sexo" id="sexoM" class="input-op" value="M">Masculino
            <input type="radio" name="sexo" id="sexoF" class="input-op" value="M">Feminino
            <input type="radio" name="sexo" id="sexoN" class="input-op" value="M">Não Declarar

            <label for="preferencias">Preferências:</label>
            <input type="checkbox" name="estudo" id="estudo" class="input-op" value="estudo">Estudo
            <input type="checkbox" name="trabalho" id="trabalho" class="input-op" value="estudo">Trabalho
            <input type="checkbox" name="viagem" id="viagem" class="input-op" value="estudo">Viagem
            <input type="checkbox" name="compras" id="compras" class="input-op" value="estudo">Compras

            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" class="input-vlr02" maxlength="6" required
                placeholder="Informe a senha">

            <label for="estado">Estado</label>
            <select name="estado" id="estado" class="input-vlr02" required>
                <option>Escolha seu Estado</option>
                <option value="Al">Alagoas</option>
                <option value="Ba">Bahia</option>
                <option value="Ce">Ceará</option>
                <option value="Ma">Maranhão</option>
                <option value="Pb">Paraíba</option>
                <option value="Pe">Pernambuco</option>
                <option value="Pi">Piauí</option>
            </select>

            <label for="comentario">Comentário</label>
            <textarea name="comentario" id="comentario" placeholder="Informe seu Comentário" required
            ></textarea>

            <button type="submit" id="btn-enviar">Enviar</button>
            <button type="reset" id="btn-limpar">Limpar</button>
            <button id="btn">Botão</button>

        </form>
    </div>

</body>

</html>
